<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="TrackEverything - tracking and temporal smoothing for any detection model">
  <title>TrackEverything</title>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#121e35"/>
      <stop offset="1" stop-color="#0d1526"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.21" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- panel: the logo carries its own background so it reads identically
       in GitHub's light and dark themes -->
  <rect width="1200" height="300" rx="28" fill="url(#panel)"/>
  <rect width="1200" height="300" rx="28" fill="url(#glow)"/>

  <!-- ==================== mark ====================
       the same object across four frames: three fading history boxes,
       then the live track with a locked reticle and a stable id -->
  <g transform="translate(96 0)">

    <!-- motion trail through the box centres -->
    <path d="M 40 158 C 96 150, 152 146, 214 142"
          fill="none" stroke="url(#trail)" stroke-width="2.5"
          stroke-dasharray="1 7" stroke-linecap="round"/>

    <!-- frame n-3 -->
    <rect x="12" y="108" width="56" height="98" rx="7"
          fill="#38bdf8" fill-opacity="0.04"
          stroke="#38bdf8" stroke-opacity="0.22" stroke-width="2"/>
    <!-- frame n-2 -->
    <rect x="58" y="100" width="58" height="104" rx="7"
          fill="#38bdf8" fill-opacity="0.06"
          stroke="#38bdf8" stroke-opacity="0.40" stroke-width="2"/>
    <!-- frame n-1 -->
    <rect x="108" y="92" width="60" height="110" rx="7"
          fill="#38bdf8" fill-opacity="0.09"
          stroke="#38bdf8" stroke-opacity="0.62" stroke-width="2"/>

    <!-- current frame: the live track -->
    <rect x="162" y="78" width="74" height="132" rx="8"
          fill="#34d399" fill-opacity="0.10"
          stroke="#34d399" stroke-width="3"/>

    <!-- corner reticle on the live track -->
    <g stroke="#a7f3d0" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M 156 96 L 156 72 L 180 72"/>
      <path d="M 218 72 L 242 72 L 242 96"/>
      <path d="M 242 192 L 242 216 L 218 216"/>
      <path d="M 180 216 L 156 216 L 156 192"/>
    </g>

    <!-- identity chip: the thing that survives between frames -->
    <g transform="translate(162 40)">
      <rect x="0" y="0" width="74" height="26" rx="13" fill="#34d399"/>
      <text x="37" y="18" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="14" font-weight="700" fill="#052e1a"
            letter-spacing="0.5">ID 7</text>
    </g>

    <!-- confidence readout -->
    <text x="199" y="244" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="15" font-weight="600" fill="#34d399"
          fill-opacity="0.85">98%</text>
  </g>

  <!-- ==================== wordmark ==================== -->
  <g transform="translate(430 0)">
    <text x="0" y="152"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', 'Helvetica Neue', Arial, sans-serif"
          font-size="70" font-weight="700" letter-spacing="-1.5">
      <tspan fill="#f8fafc">Track</tspan><tspan fill="#34d399">Everything</tspan>
    </text>

    <text x="3" y="196"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', 'Helvetica Neue', Arial, sans-serif"
          font-size="23" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Turn any detection model into a tracker.
    </text>

    <!-- capability strip -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
       font-size="14" font-weight="500" fill="#64748b" letter-spacing="0.4">
      <text x="3" y="232">OpenCV tracking</text>
      <text x="152" y="232" fill="#334155">/</text>
      <text x="172" y="232">Hungarian matching</text>
      <text x="352" y="232" fill="#334155">/</text>
      <text x="372" y="232">temporal smoothing</text>
    </g>
  </g>
</svg>
