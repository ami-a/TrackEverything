name: Publish to PyPI

# Inert until a GitHub Release is published, so it costs nothing if no
# release is ever cut.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      # Required for PyPI Trusted Publishing: there is no API token to
      # store, rotate or leak.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Build distribution
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
